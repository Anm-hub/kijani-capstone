apiVersion: apps/v1
kind: Deployment
metadata:
  name: kk-payments
  namespace: kijani
  annotations:
    kubernetes.io/change-cause: "Initial deployment of kk-payments v1.0.0 utilizing decoupled cloudflare r2 integrations"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: kk-payments
  template:
    metadata:
      labels:
        app: kk-payments
    spec:
      containers:
        - name: kk-payments-service
          image: ghcr.io/anm-hub/kk-payments:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          envFrom:
            - configMapRef:
                name: kk-payments-config
            - secretRef:
                name: cloudflare-r2-credentials
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
