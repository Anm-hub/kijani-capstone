apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-r2-credentials
  namespace: kijani
type: Opaque
stringData:
  # Provide your restricted scoped R2 API token access keys here directly
  R2_ACCESS_KEY_ID: "YOUR_CLOUDFLARE_R2_ACCESS_KEY_ID"
  R2_SECRET_ACCESS_KEY: "YOUR_CLOUDFLARE_R2_SECRET_ACCESS_KEY"

