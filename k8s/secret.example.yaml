apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-r2-credentials
  namespace: kijani
type: Opaque
data:
  # Provide base64 encoded strings of your restricted scoped R2 access tokens here
  access-key-id: "PLACEHOLDER_BASE64_ACCESS_KEY_ID"
  secret-access-key: "PLACEHOLDER_BASE64_SECRET_ACCESS_KEY"
