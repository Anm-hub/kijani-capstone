#:schema ../../node_modules/wrangler/config-schema.json
name = "kk-notifier-staging"
main = "index.js"
compatibility_date = "2025-09-01"

[observability]
enabled = true

[vars]
STAGE = "staging"
NOTIFICATION_CHANNEL = "log"

[[r2_buckets]]
binding = "DELIVERED_BUCKET"
bucket_name = "kijani-delivered-staging"

[[queues.producers]]
binding = "DELIVERED_QUEUE"
queue = "kijani-delivered-events-staging"

[[queues.consumers]]
queue = "kijani-notify-events-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "kijani-dead-letters-staging"
